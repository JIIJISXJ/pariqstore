<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Pariq Store للهدايا والإكسسوارات والعناية بالبشرة ومستحضرات التجميل">
  <title>Pariq Store | اختاري لمستك الخاصة</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --cream: #fbf8f4;
      --white: #fff;
      --rose: #b77983;
      --rose-dark: #774952;
      --rose-pale: #f2e6e4;
      --gold: #b29461;
      --ink: #302628;
      --muted: #887b79;
      --line: #eee6e1;
      --shadow: 0 14px 38px rgba(69, 42, 46, .09);
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      color: var(--ink);
      background: var(--cream);
      font-family: "Cairo", Arial, sans-serif;
    }

    button,
    input {
      font: inherit;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .announcement {
      padding: 8px 14px;
      color: #fff;
      background: var(--rose-dark);
      text-align: center;
      font-size: 13px;
    }

    .header {
      position: sticky;
      top: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 22px;
      padding: 12px 7%;
      background: rgba(251, 248, 244, .97);
      border-bottom: 1px solid var(--line);
      backdrop-filter: blur(12px);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 11px;
      color: var(--rose-dark);
      font-size: 22px;
      font-weight: 800;
      white-space: nowrap;
    }

    .brand img {
      width: 52px;
      height: 52px;
      object-fit: cover;
      border: 1px solid #e6d2ce;
      border-radius: 50%;
    }

    .nav {
      display: flex;
      align-items: center;
      gap: 22px;
      color: #55484a;
      font-size: 14px;
    }

    .nav a:hover {
      color: var(--rose);
    }

    .cart-button,
    .button {
      border: 0;
      border-radius: 30px;
      padding: 11px 19px;
      color: white;
      background: var(--rose-dark);
      cursor: pointer;
      transition: .2s ease;
    }

    .cart-button:hover,
    .button:hover {
      background: var(--rose);
      transform: translateY(-1px);
    }

    .hero {
      min-height: 550px;
      display: flex;
      align-items: center;
      padding: 60px 8%;
      background:
        linear-gradient(90deg, rgba(251,248,244,.96) 0%, rgba(251,248,244,.80) 45%, rgba(251,248,244,.18) 100%),
        url("pariq.jpg") center 44% / cover no-repeat;
    }

    .hero-content {
      max-width: 570px;
    }

    .eyebrow {
      margin: 0 0 10px;
      color: var(--gold);
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 2px;
    }

    .hero h1 {
      margin: 0;
      color: var(--rose-dark);
      font-size: clamp(42px, 7vw, 76px);
      line-height: 1.2;
    }

    .hero h1 span {
      color: var(--ink);
      font-size: .48em;
      font-weight: 500;
    }

    .hero p {
      max-width: 480px;
      margin: 18px 0 26px;
      color: #6f6261;
      line-height: 2;
      font-size: 17px;
    }

    .hero .button {
      display: inline-block;
      padding: 13px 28px;
    }

    .section {
      padding: 72px 7%;
    }

    .section-heading {
      margin-bottom: 30px;
      text-align: center;
    }

    .section-heading .eyebrow {
      margin-bottom: 4px;
    }

    .section-heading h2 {
      margin: 0;
      color: var(--rose-dark);
      font-size: clamp(26px, 4vw, 37px);
    }

    .section-heading p {
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 14px;
    }

    .categories {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 16px;
      max-width: 1100px;
      margin: auto;
    }

    .category {
      width: 100%;
      min-height: 145px;
      display: grid;
      align-content: center;
      justify-items: center;
      padding: 18px 12px;
      border: 1px solid var(--line);
      border-radius: 17px;
      color: var(--ink);
      background: var(--white);
      font-family: inherit;
      text-align: center;
      cursor: pointer;
      transition: .22s ease;
    }

    .category:hover {
      border-color: #d7b5b7;
      box-shadow: var(--shadow);
      transform: translateY(-4px);
    }

    .category:focus-visible {
      outline: 2px solid var(--rose);
      outline-offset: 3px;
    }

    .category-icon {
      margin-bottom: 5px;
      font-size: 32px;
    }

    .category h3 {
      margin: 0;
      font-size: 15px;
    }

    .category-hint {
      margin-top: 4px;
      color: var(--rose);
      font-size: 11px;
    }

    .shop {
      background: #f5efeb;
      scroll-margin-top: 100px;
    }

    .shop-tools {
      max-width: 1120px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin: 0 auto 25px;
    }

    .filters {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .filter {
      padding: 8px 15px;
      border: 1px solid #dfceca;
      border-radius: 24px;
      color: var(--rose-dark);
      background: transparent;
      cursor: pointer;
      transition: .2s ease;
    }

    .filter.active,
    .filter:hover {
      color: white;
      background: var(--rose-dark);
      border-color: var(--rose-dark);
    }

    .search {
      width: 240px;
      padding: 10px 15px;
      border: 1px solid #dfceca;
      border-radius: 24px;
      outline-color: var(--rose);
      background: white;
    }

    .products {
      max-width: 1120px;
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 18px;
      margin: auto;
    }

    .product-card {
      overflow: hidden;
      border: 1px solid #eee5e1;
      border-radius: 15px;
      background: white;
      box-shadow: 0 7px 20px rgba(69, 42, 46, .045);
      transition: .25s ease;
    }

    .product-card:hover {
      box-shadow: var(--shadow);
      transform: translateY(-4px);
    }

    .product-image-wrap {
      position: relative;
      overflow: hidden;
      background: #f0e8e4;
    }

    .product-image {
      display: block;
      width: 100%;
      height: 235px;
      object-fit: cover;
      transition: transform .4s ease;
    }

    .product-card:hover .product-image {
      transform: scale(1.04);
    }

    .tag {
      position: absolute;
      top: 12px;
      right: 12px;
      padding: 5px 10px;
      border-radius: 20px;
      color: white;
      background: var(--rose-dark);
      font-size: 11px;
    }

    .product-info {
      padding: 15px;
    }

    .product-category {
      color: var(--gold);
      font-size: 12px;
    }

    .product-info h3 {
      margin: 5px 0 13px;
      font-size: 15px;
      font-weight: 600;
    }

    .product-bottom {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .price {
      color: var(--rose-dark);
      font-size: 16px;
      font-weight: 800;
    }

    .add-button {
      padding: 8px 11px;
      border: 0;
      border-radius: 20px;
      color: white;
      background: var(--rose);
      cursor: pointer;
      font-size: 12px;
    }

    .add-button:hover {
      background: var(--rose-dark);
    }

    .empty-message {
      grid-column: 1 / -1;
      padding: 25px;
      color: var(--muted);
      text-align: center;
    }

    .cart-box {
      max-width: 1120px;
      margin: 25px auto 0;
      padding: 18px;
      border: 1px solid #e7d9d4;
      border-radius: 15px;
      background: white;
      text-align: center;
      scroll-margin-top: 100px;
    }

    .cart-box p {
      margin: 0 0 12px;
      color: var(--muted);
    }

    .about {
      max-width: 740px;
      margin: auto;
      color: #6f6261;
      line-height: 2;
      text-align: center;
    }

    .contact {
      padding: 58px 7%;
      background: var(--rose-pale);
      text-align: center;
    }

    .contact h2 {
      margin: 0;
      color: var(--rose-dark);
      font-size: 30px;
    }

    .contact p {
      color: #6f6261;
    }

    footer {
      padding: 20px;
      color: var(--muted);
      background: var(--cream);
      text-align: center;
      font-size: 13px;
    }

    @media (max-width: 900px) {
      .header {
        flex-wrap: wrap;
        justify-content: center;
      }

      .products {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .hero {
        background-position: center;
      }
    }

    @media (max-width: 600px) {
      .header {
        gap: 10px;
        padding: 10px 4%;
      }

      .nav {
        order: 3;
        width: 100%;
        justify-content: center;
        flex-wrap: wrap;
        gap: 8px 16px;
        font-size: 13px;
      }

      .hero {
        min-height: 450px;
        padding: 40px 7%;
        background:
          linear-gradient(rgba(251,248,244,.83), rgba(251,248,244,.74)),
          url("pariq.jpg") center / cover no-repeat;
      }

      .hero p {
        font-size: 15px;
      }

      .section {
        padding: 52px 5%;
      }

      .categories {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
      }

      .category {
        min-height: 125px;
      }

      .shop-tools {
        align-items: stretch;
        flex-direction: column;
      }

      .search {
        width: 100%;
      }

      .products {
        gap: 11px;
      }

      .product-image {
        height: 175px;
      }

      .product-info {
        padding: 11px;
      }

      .product-bottom {
        align-items: flex-start;
        flex-direction: column;
      }
    }
  </style>
</head>
